<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boo Gift House</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf7f8;color:#39363a;font:15px Arial,sans-serif}header{padding:20px;background:linear-gradient(120deg,#f5e3e8,#e6eff8)}h1{margin:0;font-size:22px}nav{display:flex;overflow:auto;gap:6px;padding:9px;background:white;position:sticky;top:0}nav button{white-space:nowrap;border:0;border-radius:18px;padding:9px 12px;background:#f3eaed}nav .on,button.primary{background:#ad6c80;color:white}main{max-width:900px;margin:auto;padding:14px}.card{background:white;border:1px solid #eee2e7;border-radius:14px;padding:14px;margin-bottom:12px}h2{font-size:19px}label{display:block;font-weight:bold;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #e2d9dd;border-radius:9px;font:inherit}textarea{min-height:65px}button{padding:10px 12px;border:1px solid #e4d9de;border-radius:9px;background:white;margin:5px 4px 3px 0}button.primary{border:0}.muted{color:#7b7479;font-size:12px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.item{border-top:1px solid #eee;padding:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{font-size:21px;font-weight:bold}.thumb{max-width:90px;max-height:90px;object-fit:contain}.note{white-space:pre-wrap;background:#f8f1f4;padding:10px;border-radius:8px}.right{float:right}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1 id="brand">Boo Gift House</h1><div class="muted">Manajemen Baby Hampers · Tanjungpinang</div></header><nav id="nav"></nav><main id="app"></main>
<script>
const K='booBabyHampers_v3',blank={settings:{name:'Boo Gift House',logo:''},products:[],materials:[],moves:[],orders:[],cash:[]};let db;try{db=JSON.parse(localStorage.getItem(K))||blank}catch(e){db=blank}for(let k in blank)if(!db[k])db[k]=blank[k];
const $=x=>document.getElementById(x),money=n=>'Rp '+Math.round(+n||0).toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='Ringkasan',recipe=[];
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Penyimpanan browser penuh. Situs online hanya tempat aplikasi; data masih tersimpan di browser HP, bukan database cloud. Unduh backup, lalu kurangi/hapus foto berukuran besar. Untuk sinkron online antarperangkat perlu database cloud terpisah.')}}function go(p){page=p;render()}
const pages=['Ringkasan','Daftar Produk','Produk','HPP','Stok','Pesanan','Buku Kas','Template WA','Ide Konten','Pengaturan','Backup'];
function next(cat,g){let a=db.products.filter(p=>p.cat===cat&&(p.gender||'')===g&&p.code).map(p=>+p.code);return String(Math.max(0,...a)+1).padStart(2,'0')}
function productLabel(p){return [p.cat,p.gender,p.code,p.name].filter(Boolean).join(' ')}
function customType(c){return c==='Hampers Custom'||c==='Parsel Custom'}
function bal(id){let m=db.materials.find(x=>x.id===id);return m?m.opening+db.moves.filter(x=>x.mid===id&&x.type==='Masuk').reduce((a,x)=>a+x.qty,0)-db.moves.filter(x=>x.mid===id&&x.type==='Keluar').reduce((a,x)=>a+x.qty,0):0}
function render(){ $('nav').innerHTML=pages.map(p=>`<button class="${page===p?'on':''}" onclick="go('${p}')">${p}</button>`).join('');$('brand').textContent=db.settings.name;let a=$('app');
if(page==='Ringkasan')a.innerHTML=`<h2>Ringkasan</h2><div class="grid"><div class="card">Pesanan<div class="metric">${db.orders.length}</div></div><div class="card">Omzet<div class="metric">${money(db.orders.reduce((s,o)=>s+o.total,0))}</div></div><div class="card">Produk<div class="metric">${db.products.length}</div></div><div class="card">Bahan<div class="metric">${db.materials.length}</div></div></div><div class="card muted">Data tersimpan di browser perangkat ini. Backup berkala dari menu Backup.</div>`;
if(page==='Daftar Produk'){let groups=['Hampers Box Boy','Hampers Box Girl','Parsel Baby','Hampers Custom','Parsel Custom'];a.innerHTML=`<h2>Daftar Produk</h2><p class="muted">Daftar ini terpisah dari menu Produk. Tambah atau ubah data produk melalui menu Produk.</p>${groups.map(g=>{let arr=db.products.filter(p=>g==='Hampers Box Boy'?p.cat==='Hampers Box'&&p.gender==='Boy':g==='Hampers Box Girl'?p.cat==='Hampers Box'&&p.gender==='Girl':p.cat===g);return `<div class="card"><b>${g}</b><span class="right muted">${arr.length} produk</span>${arr.map(p=>`<div class="item">${p.photo?`<img class="thumb" src="${p.photo}">`:''}<b>${esc(productLabel(p))}</b><div>${money(p.price)} · Stok ${p.qty} · HPP ${money(p.hpp)}</div></div>`).join('')||'<div class="muted">Belum ada produk.</div>'}</div>`}).join('')}`}
if(page==='Produk')a.innerHTML=`<h2>Kelola Produk</h2><div class="card"><label>Kategori produk</label><select id="cat" onchange="fields()"><option>Hampers Box</option><option>Parsel Baby</option><option>Hampers Custom</option><option>Parsel Custom</option></select><div id="genderbox"><label>Jenis</label><select id="gender"><option>Boy</option><option>Girl</option></select></div><div id="numberbox"><label>Nomor otomatis</label><input id="code" readonly></div><label>Nama produk</label><input id="name" placeholder="Nama produk atau nama pesanan custom"><label>Harga jual (Rp)</label><input id="price" type="number"><label>Stok awal produk jadi</label><input id="qty" type="number" value="0"><label>Isi produk</label><textarea id="contents"></textarea><label>Foto produk</label><input id="photo" type="file" accept="image/*"><div id="preview"></div><button class="primary" onclick="addProduct()">Simpan produk</button></div><div class="card"><h3>Produk tersimpan</h3>${db.products.map((p,i)=>`<div class="item">${p.photo?`<img class="thumb" src="${p.photo}">`:''}<b>${esc(productLabel(p))}</b><div>${money(p.price)} · Stok ${p.qty} · HPP ${money(p.hpp)}</div><button onclick="editP(${i})">Edit</button><button onclick="delP(${i})">Hapus</button></div>`).join('')||'Belum ada produk.'}</div>`;if(page==='Produk'){fields();$('photo').onchange=e=>readImage(e.target.files[0],v=>$('preview').innerHTML=`<img class="thumb" src="${v}">`)}
if(page==='HPP')a.innerHTML=`<h2>HPP & Resep Bahan</h2><div class="card"><label>Produk</label><select id="hp" onchange="loadRecipe()"><option value="">Pilih</option>${db.products.map(p=>`<option value="${p.id}">${esc(productLabel(p))}</option>`)}</select><label>Bahan persediaan</label><select id="mat">${db.materials.map(m=>`<option value="${m.id}">${esc(m.name)} · stok ${bal(m.id)} ${esc(m.unit)}</option>`)}</select><label>Jumlah bahan per produk</label><input id="rq" type="number" step="0.01" value="1"><label>Biaya tambahan per produk (Rp)</label><input id="extra" type="number" value="0"><button onclick="addRecipe()">Tambah bahan</button><div id="recipes"></div><label>Harga jual (Rp)</label><input id="sell" type="number" value="0"><p>HPP: <b id="hpp">Rp 0</b> · Laba: <b id="profit">Rp 0</b></p><button class="primary" onclick="saveRecipe()">Simpan HPP</button></div>`;
if(page==='Stok')a.innerHTML=`<h2>Stok Bahan</h2><div class="card"><h3>Daftarkan bahan + stok awal</h3><label>Nama bahan</label><input id="mn"><div class="row"><div><label>Satuan</label><input id="unit" placeholder="pcs/meter"></div><div><label>Stok awal</label><input id="opening" type="number" value="0"></div></div><label>Batas minimum</label><input id="min" type="number" value="0"><label>Harga beli satuan (Rp)</label><input id="mcost" type="number" value="0"><button class="primary" onclick="addMat()">Simpan bahan</button></div><div class="card"><h3>Stok masuk / keluar</h3><label>Bahan</label><select id="mid">${db.materials.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`)}</select><label>Jenis</label><select id="type"><option>Masuk</option><option>Keluar</option></select><label>Jumlah</label><input id="mqty" type="number" value="1"><label>Keterangan / sumber</label><input id="reason" placeholder="Pembelian Shopee / pemakaian"><button class="primary" onclick="moveStock()">Simpan pergerakan</button></div><div class="card"><h3>Saldo otomatis</h3>${db.materials.map(m=>`<div class="item"><b>${esc(m.name)}</b><b class="right">${bal(m.id)} ${esc(m.unit)}</b><div class="muted">Awal ${m.opening} · Masuk ${db.moves.filter(x=>x.mid===m.id&&x.type==='Masuk').reduce((s,x)=>s+x.qty,0)} · Keluar ${db.moves.filter(x=>x.mid===m.id&&x.type==='Keluar').reduce((s,x)=>s+x.qty,0)}</div></div>`).join('')}</div>`;
if(page==='Pesanan')a.innerHTML=`<h2>Pesanan</h2><div class="card"><label>Nama pembeli</label><input id="buyer"><label>WhatsApp</label><input id="wa"><label>Produk</label><select id="op">${db.products.map(p=>`<option value="${p.id}">${esc(productLabel(p))} ${money(p.price)}</option>`)}</select><div class="row"><div><label>Jumlah</label><input id="oq" type="number" value="1"></div><div><label>Ongkir (Rp)</label><input id="ship" type="number" value="0"></div></div><label>Pengiriman</label><select id="delivery"><option>Kurir</option><option>Ambil sendiri</option></select><label>Alamat / catatan</label><textarea id="address"></textarea><div class="row"><div><label>Pembayaran</label><select id="pay"><option>QRIS</option><option>Cash</option><option>Transfer</option></select></div><div><label>Status</label><select id="status"><option>Belum dibayar</option><option>DP</option><option>Lunas</option></select></div></div><label>DP (Rp)</label><input id="dp" type="number" value="0"><button class="primary" onclick="addOrder()">Simpan pesanan</button></div><div class="card"><h3>Daftar pesanan</h3><button class="primary" onclick="exportExcel()">Ekspor data pembeli ke Excel</button>${db.orders.slice().reverse().map(o=>`<div class="item"><b>${esc(o.buyer)}</b> · ${esc(o.product)}<div>${money(o.total)} · ${esc(o.status)}</div><button onclick="waNota('${o.id}')">Nota WhatsApp + logo</button><button onclick="notaImage('${o.id}')">Unduh gambar nota</button></div>`).join('')}</div>`;
if(page==='Buku Kas')a.innerHTML=`<h2>Buku Kas</h2><div class="card"><label>Jenis</label><select id="ct"><option>Masuk</option><option>Keluar</option></select><label>Keterangan</label><input id="cd"><label>Jumlah (Rp)</label><input id="ca" type="number"><button class="primary" onclick="addCash()">Simpan</button></div><div class="card">${db.cash.map(c=>`<div class="item">${esc(c.type)} · ${esc(c.desc)} <b class="right">${money(c.amount)}</b></div>`).join('')}</div>`;
if(page==='Template WA'){let t=[['Tanya ketersediaan','Halo Kak 😊 Ada, Kak. Boo Gift House menyediakan pilihan Hampers Box dan Parsel Baby. Kakak sedang mencari hampers untuk hadiah kunjungan newborn?'],['Tanya harga','Harga hampers berbeda sesuai model dan isi paketnya, Kak. Kami bisa kirimkan katalog berisi foto, detail isi, dan harga agar Kakak lebih mudah memilih.'],['Custom','Bisa, Kak. Kami juga menerima permintaan Hampers Custom dan Parsel Custom. Kakak boleh menyampaikan anggaran, pilihan isi, dan tanggal dibutuhkan.'],['Tanya tanggal dibutuhkan','Hampersnya dibutuhkan untuk tanggal berapa ya, Kak? Biar kami cek jadwal pengerjaan dan pengirimannya.'],['Ready atau PO','Untuk hampers kami dibuat terlebih dahulu setelah pesanan dikonfirmasi, ya Kak. Jadi sistemnya pre-order (PO), bukan barang ready kirim. Boleh info tanggal dibutuhkan agar kami cek apakah masih bisa dikerjakan tepat waktu?'],['Konfirmasi pesanan','Baik Kak, kami catat pesanannya. Sebelum mulai dibuat, mohon konfirmasi model, jumlah, tanggal dibutuhkan, alamat/pengambilan, dan pembayaran ya. Terima kasih sudah memilih Boo Gift House 💗'],['Tanya pengiriman','Pengiriman bisa menggunakan kurir atau ambil sendiri, Kak. Jika menggunakan kurir, ongkir menyesuaikan alamat tujuan.']];window.templates=t;a.innerHTML='<h2>Template Jawaban WhatsApp</h2>'+t.map((v,i)=>`<div class="card"><b>${v[0]}</b><div class="note">${esc(v[1])}</div><button onclick="copyT(${i})">Salin jawaban</button></div>`).join('')}
if(page==='Ide Konten'){let ds=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],idx=new Date().getDay(),day=ds[idx],ideas=[['Foto satu hampers tampak depan','Video 10 detik: close-up isi hampers'],['Foto detail isi dan harga','Video proses susun 2–3 barang'],['Foto kemasan, pita, dan kartu','Video ikat pita atau masukkan ke tas'],['Foto pilihan Hampers Box / Parsel Baby','Video perlihatkan isi dari atas'],['Foto ukuran hampers dari dekat','Video putar hampers perlahan'],['Foto hampers siap diberikan','Video proses packing pesanan'],['Foto testimoni pelanggan (dengan izin)','Video rangkuman pesanan minggu ini']][idx];a.innerHTML=`<h2>Ide Konten Harian</h2><div class="card"><b>Hari ini: ${day}, ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</b><p class="muted">Dua kali upload saja. Gunakan bahan foto/video yang sama untuk semua platform.</p><div class="item"><b>11.30 WIB — Upload 1 (foto)</b><div>${ideas[0]}</div><div class="muted">Instagram Feed/Story · WhatsApp Status · TikTok Photo</div></div><div class="item"><b>19.00 WIB — Upload 2 (video)</b><div>${ideas[1]}</div><div class="muted">Instagram Reels/Story · WhatsApp Status · TikTok Video</div></div></div><div class="card"><h3>Checklist take foto/video hari ini</h3><ul><li>Foto produk tampak depan dengan latar bersih.</li><li>Foto detail isi, pita, dan kemasan.</li><li>Video close-up isi selama 5–10 detik.</li><li>Video proses merapikan atau packing selama 10–15 detik.</li></ul><p class="muted">Tidak perlu properti tambahan. Pakai cahaya jendela, meja bersih, dan satu produk. Besok ide otomatis berganti mengikuti hari.</p></div>`}
if(page==='Pengaturan')a.innerHTML=`<h2>Pengaturan</h2><div class="card"><label>Nama usaha</label><input id="biz" value="${esc(db.settings.name)}"><label>Upload logo</label><input id="logo" type="file" accept="image/*"><div>${db.settings.logo?`<img class="thumb" src="${db.settings.logo}">`:''}</div><button class="primary" onclick="saveSettings()">Simpan nama dan logo</button><p class="muted">Logo akan masuk ke gambar nota. WhatsApp mungkin tidak dapat melampirkan gambar otomatis dari browser; jika begitu, unduh nota lalu lampirkan sendiri.</p></div>`;
if(page==='Backup')a.innerHTML=`<h2>Backup data</h2><div class="card"><p class="muted">Data tersimpan di browser perangkat ini, tidak otomatis sinkron ke perangkat lain.</p><button class="primary" onclick="backup()">Unduh backup JSON</button><label>Pulihkan backup</label><input id="restore" type="file" accept=".json"><button onclick="restoreData()">Pulihkan</button></div>`;
}
function fields(){let c=$('cat').value,custom=customType(c),isBox=c==='Hampers Box',g=isBox?$('gender').value:'';$('genderbox').style.display=isBox?'block':'none';$('numberbox').style.display=custom?'none':'block';if($('code'))$('code').value=custom?'':next(c,g)}
function readImage(f,cb){if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.55))};im.src=r.result};r.readAsDataURL(f)}
function addProduct(){let cat=$('cat').value,g=cat==='Hampers Box'?$('gender').value:'',n=$('name').value.trim();if(!n)return alert('Isi nama produk.');let done=photo=>{db.products.push({id:'p'+Date.now(),cat,gender:g,code:customType(cat)?'':next(cat,g),name:n,price:+$('price').value||0,qty:+$('qty').value||0,contents:$('contents').value,photo:photo||'',recipe:[],hpp:0});save();render()};let f=$('photo').files[0];if(f)readImage(f,done);else done('')}
function editP(i){let p=db.products[i],n=prompt('Nama produk',p.name);if(n===null)return;p.name=n;let v=prompt('Harga jual angka saja',p.price);if(v!==null)p.price=+v||0;save();render()}function delP(i){if(confirm('Hapus produk?')){db.products.splice(i,1);save();render()}}
function loadRecipe(){let p=db.products.find(x=>x.id===$('hp').value);recipe=p?(p.recipe||[]).map(x=>({...x})):[];$('sell').value=p?.price||0;$('extra').value=p?.extra||0;drawRecipe()}
function addRecipe(){let mid=$('mat').value;if(!mid)return alert('Daftarkan bahan dahulu di menu Stok.');recipe.push({mid,qty:+$('rq').value||0});drawRecipe()}
function drawRecipe(){if(!$('recipes'))return;$('recipes').innerHTML=recipe.map((r,i)=>{let m=db.materials.find(x=>x.id===r.mid);return `<div class="item">${esc(m?.name)} · ${r.qty} ${esc(m?.unit||'')} <button onclick="recipe.splice(${i},1);drawRecipe()">Hapus</button></div>`}).join('');let cost=recipe.reduce((s,r)=>{let m=db.materials.find(x=>x.id===r.mid);return s+(m?.cost||0)*r.qty},0)+((+$('extra').value)||0);$('hpp').textContent=money(cost);$('profit').textContent=money((+$('sell').value||0)-cost)}
function saveRecipe(){let p=db.products.find(x=>x.id===$('hp').value);if(!p)return alert('Pilih produk');p.recipe=recipe;p.extra=+$('extra').value||0;p.hpp=recipe.reduce((s,r)=>s+(db.materials.find(m=>m.id===r.mid)?.cost||0)*r.qty,0)+p.extra;p.price=+$('sell').value||p.price;save();alert('HPP disimpan');render()}
function addMat(){if(!$('mn').value.trim())return alert('Isi nama bahan');db.materials.push({id:'m'+Date.now(),name:$('mn').value,unit:$('unit').value||'pcs',opening:+$('opening').value||0,minimum:+$('min').value||0,cost:+$('mcost').value||0});save();render()}
function moveStock(){let id=$('mid').value,q=+$('mqty').value||0,t=$('type').value;if(!id||q<=0)return alert('Pilih bahan dan jumlah');if(t==='Keluar'&&q>bal(id))return alert('Stok tidak cukup');db.moves.push({mid:id,type:t,qty:q,note:$('reason').value});save();render()}
function addOrder(){let p=db.products.find(x=>x.id===$('op').value);if(!p)return alert('Pilih produk');let q=+$('oq').value||1;for(let r of p.recipe||[])if(bal(r.mid)<r.qty*q)return alert('Stok bahan tidak cukup: '+db.materials.find(m=>m.id===r.mid)?.name);let total=p.price*q+(+$('ship').value||0),o={id:'o'+Date.now(),date:new Date().toISOString(),buyer:$('buyer').value,wa:$('wa').value,product:`${p.cat} ${p.gender?p.gender+' ':''}${p.code} ${p.name}`,qty:q,price:p.price,shipping:+$('ship').value||0,total,delivery:$('delivery').value,address:$('address').value,pay:$('pay').value,status:$('status').value,dp:+$('dp').value||0};if(!o.buyer.trim())return alert('Isi nama pembeli');(p.recipe||[]).forEach(r=>db.moves.push({mid:r.mid,type:'Keluar',qty:r.qty*q,note:'Bahan pesanan '+o.id}));p.qty=Math.max(0,p.qty-q);db.orders.push(o);db.cash.push({type:'Masuk',desc:'Pembayaran '+o.buyer,amount:o.dp||(o.status==='Lunas'?total:0)});save();render()}
function txt(o){return `${db.settings.name}\nNOTA PESANAN\nNo: ${o.id}\nPembeli: ${o.buyer}\nWA: ${o.wa}\nProduk: ${o.product}\nJumlah: ${o.qty}\nHarga satuan: ${money(o.price)}\nOngkir: ${money(o.shipping)}\nTOTAL: ${money(o.total)}\nPembayaran: ${o.pay}\nStatus: ${o.status}\nDP: ${money(o.dp)}\nSisa: ${money(o.total-o.dp)}\nPengiriman: ${o.delivery}\nAlamat/catatan: ${o.address||'-'}\nTerima kasih telah berbelanja 💗`}
function canvasNota(o){return new Promise(resolve=>{let c=document.createElement('canvas');c.width=900;c.height=1100;let x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,900,1100);x.fillStyle='#f4e3e9';x.fillRect(0,0,900,190);let finish=()=>{x.fillStyle='#39363a';x.textAlign='center';x.font='bold 38px Arial';x.fillText(db.settings.name,450,245);x.font='bold 28px Arial';x.fillText('NOTA PESANAN',450,300);x.textAlign='left';x.font='23px Arial';let y=370;txt(o).split('\n').slice(2).forEach(line=>{x.fillText(line.slice(0,60),65,y);y+=43});resolve(c)};if(db.settings.logo){let im=new Image();im.onload=()=>{x.drawImage(im,365,15,170,150);finish()};im.onerror=finish;im.src=db.settings.logo}else finish()})}
function dl(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function notaImage(id){let o=db.orders.find(x=>x.id===id),c=await canvasNota(o);c.toBlob(b=>dl(b,'nota-'+id+'.png'))}
async function waNota(id){let o=db.orders.find(x=>x.id===id),c=await canvasNota(o);c.toBlob(async b=>{let f=new File([b],'nota-'+id+'.png',{type:'image/png'});if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],text:txt(o)});return}catch(e){}}dl(b,'nota-'+id+'.png');let n=(o.wa||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);window.open('https://wa.me/'+n+'?text='+encodeURIComponent(txt(o)),'_blank');alert('Gambar nota sudah diunduh. Lampirkan gambar tersebut di WhatsApp.')})}
function exportExcel(){let rows=[['Tanggal','Nama pembeli','WhatsApp','Produk','Qty','Harga satuan','Ongkir','Total','Pembayaran','Status','DP','Sisa','Pengiriman','Catatan'],...db.orders.map(o=>[new Date(o.date).toLocaleDateString('id-ID'),o.buyer,o.wa,o.product,o.qty,o.price,o.shipping,o.total,o.pay,o.status,o.dp,o.total-o.dp,o.delivery,o.address])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),'data-pembeli-boo-gift-house.csv')}
function addCash(){db.cash.push({type:$('ct').value,desc:$('cd').value,amount:+$('ca').value||0});save();render()}
function copyT(i){let t=window.templates[i][1];if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('Teks disalin')).catch(()=>prompt('Salin teks:',t));else prompt('Salin teks:',t)}
function saveSettings(){db.settings.name=$('biz').value||'Boo Gift House';let f=$('logo').files[0];if(f)readImage(f,v=>{db.settings.logo=v;save();render()});else{save();render()}}
function backup(){dl(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'backup-boo-baby-hampers.json')}
function restoreData(){let f=$('restore').files[0];if(!f)return alert('Pilih file backup');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.materials||!d.orders)throw 0;db=d;save();render();alert('Backup dipulihkan')}catch(e){alert('File backup tidak valid')}};r.readAsText(f)}
render();
</script></main></body></html>
